<!DOCTYPE html>
<html>
<head>
    <title>Hanami's Konbini 🏪</title>
    <style>
        /* 📜 GLOBAL LAYOUT & THEME */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f7eedf; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* 🏮 CUSTOM CAFE TITLE BANNER */
        .cafe-banner {
            text-align: center;
            background: linear-gradient(135deg, #7a5c43, #5c4d43);
            padding: 20px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(92, 77, 67, 0.15);
            margin-bottom: 25px;
            border: 4px double #ebdcd0;
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
        }

        .cafe-banner h1 { 
            color: #fffdfa; 
            margin: 0 0 6px 0; 
            font-size: 28px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            font-weight: 800;
        }
        
        .cafe-banner p { 
            color: #ebdcd0; 
            margin: 0; 
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .container { 
            display: flex; 
            flex-direction: row; 
            justify-content: center; 
            gap: 30px; 
            max-width: 850px; 
            width: 100%;
        }

        /* 🎛️ CONTROL PANEL & LOG SYSTEM */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 320px;
            flex-shrink: 0;
        }

        .controls { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(139,121,102,0.1); 
            border: 1px solid #ebdcd0; 
        }

        label { 
            font-weight: bold; 
            color: #5c4d43; 
            font-size: 14px; 
            display: block; 
            margin-top: 10px; 
        } 
        
        select, button { 
            width: 100%; 
            padding: 12px; 
            font-size: 15px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: 1px solid #dcd1c4; 
            box-sizing: border-box; 
            background-color: #fcfbfa; 
        }
        
        .btn-build { background-color: #cca47c; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-build:hover { background-color: #b38b65; }
        .btn-eat { background-color: #df7a6a; color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-eat:hover { background-color: #c95d4d; }
        
        /* 📟 LIVE CODE STREAM TERMINAL */
        .terminal-log {
            background-color: #1e1e1e;
            color: #a6e22e;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            border-radius: 12px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            font-size: 12px;
            height: 140px;
            overflow-y: auto;
            border: 2px solid #3e3e3e;
        }
        .terminal-title { color: #f8f8f2; font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid #3e3e3e; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .log-ln { margin: 4px 0; white-space: pre-wrap; }
        .log-hardware { color: #66d9ef; }
        .log-binary { color: #f92672; }

        /* 🍽️ CAFE CANVAS AREA & ISOMETRIC SCENE */
        .kitchen-floor { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            width: 380px; 
            height: 480px; 
            background: #f3e9db; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(139,121,102,0.08); 
            position: relative; 
            overflow: hidden; 
            border: 1px solid #ebdcd0; 
            flex-shrink: 0;
        }

        /* PLATE BASE */
        .plate { 
            position: absolute;
            width: 220px; 
            height: 220px; 
            background-color: #ffffff; 
            border: 4px solid #3a2212;
            border-radius: 28px; 
            transform: rotateX(60deg) rotateZ(-45deg);
            box-shadow: -14px 14px 0px rgba(0,0,0,0.08);
            top: 130px;
        }

        /* ISOMETRIC STACK CONTAINER */
        .iso-sandwich-stack {
            position: absolute;
            width: 160px;
            height: 160px;
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg);
            top: 160px;
        }

        /* 🍞 ISOMETRIC INGREDIENT BASE CLASS */
        .layer { 
            position: absolute;
            top: 0;
            left: 0;
            width: 160px; 
            height: 160px;
            opacity: 0; 
            transform: translateZ(300px); 
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.25), opacity 0.3s; 
            border-radius: 14px;
            box-sizing: border-box;
            border: 3.5px solid #3a2212;
        }

        /* LAYER Z-INDEX STACKING POSITIONS WHEN DROPPED */
        #bottom-bread.dropped { opacity: 1; transform: translateZ(0px); }
        #layer-spread.dropped  { opacity: 1; transform: translateZ(24px); }
        #layer-topping.dropped { opacity: 1; transform: translateZ(48px); }
        #top-bread.dropped    { opacity: 1; transform: translateZ(85px); }

        /* 🍞 SHOKUPAN BREAD (ISOMETRIC BLOCK) */
        .shokupan { 
            background: #fffdf5; 
            box-shadow: 
                -8px 8px 0px #e2b980, 
                -8px 8px 0px 3.5px #3a2212,
                inset 0 0 12px #f3e5ca; 
        }

        /* 🥛 SWEET WHIPPED CREAM */
        .cream-base { 
            background: #ffffff; 
            box-shadow: -6px 6px 0px #cbd5e1, -6px 6px 0px 3.5px #3a2212; 
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 10px;
        }

        .cream-dollop {
            width: 44px;
            height: 44px;
            background: #ffffff;
            border-radius: 50%;
            border: 2px solid #3a2212;
            position: relative;
            box-shadow: inset -3px -3px 0px #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cream-dollop::before {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background: #f1f5f9;
            clip-path: polygon(50% 0%, 63% 38%, 100% 50%, 63% 63%, 50% 100%, 38% 63%, 0% 50%, 38% 38%);
        }

        /* 🍵 UJI MATCHA CREAM */
        .matcha-base { 
            background: #84cc16; 
            box-shadow: -6px 6px 0px #3f6212, -6px 6px 0px 3.5px #3a2212; 
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 10px;
        }

        .matcha-dollop {
            width: 44px;
            height: 44px;
            background: #84cc16;
            border-radius: 50%;
            border: 2px solid #3a2212;
            position: relative;
            box-shadow: inset -3px -3px 0px #4d7c0f;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .matcha-dollop::before {
            content: '';
            position: absolute;
            width: 28px;
            height: 28px;
            background: #a3e635;
            clip-path: polygon(50% 0%, 63% 38%, 100% 50%, 63% 63%, 50% 100%, 38% 63%, 0% 50%, 38% 38%);
        }

        /* 🍫 SAVORY TONKATSU SAUCE */
        .sauce-base { 
            background: linear-gradient(135deg, #431f0d 0%, #2a1206 100%); 
            box-shadow: 
                -5px 5px 0px #1a0b03, 
                -5px 5px 0px 3.5px #3a2212; 
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .sauce-base::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 12px;
            right: 12px;
            height: 12px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            transform: skewX(-20deg);
        }

        /* 🍓 REALISTIC SLICED STRAWBERRIES (NO FLOWERS) */
        .strawberry-row { 
            background: rgba(254, 226, 226, 0.4); 
            box-shadow: -8px 8px 0px #be123c, -8px 8px 0px 3.5px #3a2212; 
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 10px;
        }

        .berry {
            width: 44px;
            height: 50px;
            background: #e11d48;
            border-radius: 50% 50% 30% 30% / 40% 40% 60% 60%;
            border: 2.5px solid #3a2212;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 0 2px #be123c, inset -3px -3px 0px #9f1239;
            overflow: hidden;
        }

        .berry::before {
            content: '';
            position: absolute;
            width: 26px;
            height: 32px;
            background: radial-gradient(circle, #ffffff 15%, #ffe4e6 45%, #fda4af 85%);
            border-radius: 50% 50% 30% 30% / 40% 40% 60% 60%;
            border: 1.5px dashed #f43f5e;
        }

        .berry::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            top: 8px;
            opacity: 0.95;
        }

        /* 🥭 MIYAZAKI MANGO */
        .mango-row { 
            background: #ffedd5; 
            box-shadow: -8px 8px 0px #c2410c, -8px 8px 0px 3.5px #3a2212; 
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 10px;
        }

        .mango-cube {
            width: 42px;
            height: 42px;
            background: #f97316;
            border-radius: 6px;
            border: 2px solid #3a2212;
            position: relative;
            box-shadow: inset -4px -4px 0px #c2410c;
        }

        .mango-cube::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            right: 8px;
            bottom: 8px;
            background: #fbbf24;
            border-radius: 3px;
        }

        /* 🥩 CRISPY PORK KATSU */
        .katsu-block { 
            background: #d97706; 
            box-shadow: -12px 12px 0px #78350f, -12px 12px 0px 3.5px #3a2212; 
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .katsu-cut {
            width: 40px;
            height: 135px;
            background: linear-gradient(90deg, #fef3c7 0%, #fde68a 35%, #b45309 70%, #78350f 100%);
            border-radius: 6px;
            border: 2px solid #3a2212;
            position: relative;
            box-shadow: inset 0 0 6px rgba(120, 53, 15, 0.6);
            z-index: 1;
        }

        .katsu-cut::after {
            content: '';
            position: absolute;
            top: 15%;
            left: -5px;
            right: -5px;
            height: 18px;
            background: #31180a;
            border-radius: 10px;
            transform: rotate(-12deg);
        }

        /* 🍳 THICK TAMAGO OMELET */
        .tamago-block { 
            background: linear-gradient(135deg, #fef08a 0%, #facc15 60%, #eab308 100%); 
            box-shadow: -12px 12px 0px #ca8a04, -12px 12px 0px 3.5px #3a2212; 
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            border-radius: 12px;
            overflow: hidden;
        }

        .tamago-slice {
            width: 40px;
            height: 135px;
            background: radial-gradient(ellipse at 50% 50%, #fffbebe6 20%, #fde047 65%, #eab308 100%);
            border-radius: 8px;
            border: 2px solid #3a2212;
            position: relative;
            box-shadow: inset 0 0 6px rgba(202, 138, 4, 0.5);
            z-index: 1;
        }

        .tamago-slice::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 6px;
            right: 6px;
            bottom: 15px;
            border: 2px dashed rgba(161, 98, 7, 0.45);
            border-radius: 6px;
        }

        /* Utility trigger states */
        .eaten { transform: translateZ(500px) scale(0) !important; opacity: 0 !important; transition: all 0.4s ease-in !important; }
        
        #status-text { font-weight: bold; color: #8a7b71; min-height: 24px; margin-top: 15px; font-size: 15px; text-align: center; }
    </style>
</head>
<body>

    <div class="cafe-banner">
        <h1>HANAMI'S KONBINI</h1>
        <p>Fresh Tokyo-Style E-Eats ⇄ 8-Bit Hardware Bus</p>
    </div>

    <div class="container">
        
        <div class="left-panel">
            <div class="controls">
                <label>1. Select Base Layer:</label>
                <select id="spreadChoice">
                    <option value="cream-base">Sweet Whipped Cream</option>
                    <option value="matcha-base">Uji Matcha Cream</option>
                    <option value="sauce-base">Savory Tonkatsu Sauce</option>
                </select>

                <label>2. Select Center Filling:</label>
                <select id="toppingChoice">
                    <option value="strawberry-row">Fresh Strawberries 🍓</option>
                    <option value="mango-row">Miyazaki Mango 🥭</option>
                    <option value="katsu-block">Crispy Pork Katsu 🥩</option>
                    <option value="tamago-block">Thick Tamago Omelet 🍳</option>
                </select>

                <button class="btn-build" onclick="startPreparation()">Assemble Sando</button>
                <button class="btn-eat" onclick="eatSandwich()">Itadakimasu! (Eat)</button>
                
                <div id="status-text">System initialization ready...</div>
            </div>

            <div class="terminal-log">
                <div class="terminal-title"><span>CPU Instruction Register</span><span>8-Bit Bus</span></div>
                <div id="terminal-body">// Awaiting code execution loop...</div>
            </div>
        </div>

        <div class="kitchen-floor">
            <div class="plate"></div>
            <div class="iso-sandwich-stack">
                <div id="bottom-bread" class="layer"></div>
                <div id="layer-spread" class="layer"></div>
                <div id="layer-topping" class="layer"></div>
                <div id="top-bread" class="layer"></div>
            </div>
        </div>

    </div>

    <script>
        function postLog(assemblyText, binaryText) {
            var terminal = document.getElementById("terminal-body");
            if (terminal.innerHTML.indexOf("// Awaiting") !== -1) {
                terminal.innerHTML = "";
            }
            terminal.innerHTML += '<div class="log-ln"><span class="log-hardware">' + 
                assemblyText + '</span> -&gt; <span class="log-binary">' + 
                binaryText + '</span></div>';
            terminal.scrollTop = terminal.scrollHeight;
        }

        function startPreparation() {
            var bBread = document.getElementById("bottom-bread");
            var spreadL = document.getElementById("layer-spread");
            var toppingL = document.getElementById("layer-topping");
            var tBread = document.getElementById("top-bread");
            var status = document.getElementById("status-text");
            var terminal = document.getElementById("terminal-body");

            terminal.innerHTML = "";
            bBread.className = "layer"; bBread.innerHTML = "";
            spreadL.className = "layer"; spreadL.innerHTML = "";
            toppingL.className = "layer"; toppingL.innerHTML = "";
            tBread.className = "layer"; tBread.innerHTML = "";

            var spreadType = document.getElementById("spreadChoice").value;
            var toppingType = document.getElementById("toppingChoice").value;

            status.innerHTML = "Slicing Shokupan milk bread base...";
            postLog("ALLOC_MEM bread_base", "10001000");

            setTimeout(function() {
                bBread.className = "layer shokupan dropped";
                status.innerHTML = "Spreading the canvas layer...";
                postLog("LOAD_REG spread_val", "10101010");
                postLog("RENDER_OBJ " + spreadType, "11001100");
            }, 700);

            setTimeout(function() {
                spreadL.className = "layer " + spreadType + " dropped";
                if(spreadType === "cream-base") {
                    spreadL.innerHTML = '<div class="cream-dollop"></div><div class="cream-dollop"></div><div class="cream-dollop"></div>';
                } else if(spreadType === "matcha-base") {
                    spreadL.innerHTML = '<div class="matcha-dollop"></div><div class="matcha-dollop"></div><div class="matcha-dollop"></div>';
                } else if(spreadType === "sauce-base") {
                    spreadL.innerHTML = '';
                }
                status.innerHTML = "Arranging center fillings...";
                postLog("LOAD_REG filling_val", "10101111");
                postLog("RENDER_OBJ " + toppingType, "11101110");
            }, 1700);

            setTimeout(function() {
                toppingL.className = "layer " + toppingType + " dropped";
                if(toppingType === "strawberry-row") {
                    toppingL.innerHTML = '<div class="berry"></div><div class="berry"></div><div class="berry"></div>';
                } else if(toppingType === "mango-row") {
                    toppingL.innerHTML = '<div class="mango-cube"></div><div class="mango-cube"></div><div class="mango-cube"></div>';
                } else if(toppingType === "katsu-block") {
                    toppingL.innerHTML = '<div class="katsu-cut"></div><div class="katsu-cut"></div><div class="katsu-cut"></div>';
                } else if(toppingType === "tamago-block") {
                    toppingL.innerHTML = '<div class="tamago-slice"></div><div class="tamago-slice"></div><div class="tamago-slice"></div>';
                }
                status.innerHTML = "Closing with top Shokupan slice...";
                postLog("ALLOC_MEM bread_top", "10101011");
                postLog("STACK_CONCAT", "11111111");
            }, 2700);

            setTimeout(function() {
                tBread.className = "layer shokupan dropped";
                status.innerHTML = "✨ Sando complete! Ready to present.";
                postLog("SYS_EXIT 0 (SUCCESS)", "00000000");
            }, 3700);
        }

        function eatSandwich() {
            var layers = document.querySelectorAll('.layer');
            var status = document.getElementById("status-text");
            var terminal = document.getElementById("terminal-body");

            status.innerHTML = "Gochisousama! That was delicious! 😋";
            terminal.innerHTML = "";
            postLog("FLUSH_REGISTER", "00001111");
            postLog("CLEAR_MEM_STACK", "00000001");

            layers.forEach(function(layer) {
                layer.classList.add("eaten");
            });

            setTimeout(function() {
                layers.forEach(function(layer) {
                    layer.className = "layer";
                    layer.innerHTML = "";
                });
                status.innerHTML = "Plate cleared. Ready for your next run.";
            }, 400);
        }
    </script>
</body>
</html>
